[project]
name = "harnessforge-backend"
version = "0.1.0"
description = "Local deterministic agent harness backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.10.6",
  "uvicorn==0.34.0",
  "aiosqlite==0.20.0",
  "lancedb==0.17.0",
  "jinja2==3.1.5",
  "websockets==17.0.1",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::pytest.PytestDeprecationWarning"]
